<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ぼくのたぶみん ～耳たぶ育成ゲーム～</title>
  <style>

:root{
  --paper:#f6edda; --ink:#4b382c; --line:#d6c4a5; --card:#fffaf0;
  --accent:#b77954; --soft:#ead9bd;
}
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; color:var(--ink);
  font-family:"Yu Gothic","Hiragino Kaku Gothic ProN",system-ui,sans-serif;
  background:
    radial-gradient(circle at 20% 10%,#fff8e9 0 10%,transparent 28%),
    radial-gradient(circle at 85% 30%,#eadfc7 0 10%,transparent 32%),
    #e8dcc4;
}
button{font:inherit}
#app{max-width:900px;margin:auto;padding:22px}
.book{
  background:var(--paper); border:1px solid #cdbb9b; border-radius:28px;
  box-shadow:0 16px 45px #6d573c33; padding:28px; min-height:650px;
}
h1,h2,h3{margin:.2em 0 .5em}
.title{font-size:clamp(2rem,7vw,4.6rem);letter-spacing:.08em}
.subtitle{font-size:1.05rem;color:#765d49}
.center{text-align:center}
.hero{width:min(360px,80%);border-radius:30px;box-shadow:0 8px 20px #6d573c22}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin:22px 0}
.card{
  background:#fffaf0cc;border:2px solid var(--line);border-radius:20px;padding:16px;
  cursor:pointer;transition:.15s;min-height:110px;color:var(--ink)
}
.card:hover{transform:translateY(-2px);border-color:var(--accent)}
.card strong{font-size:1.12rem}
.primary,.secondary{
  border:0;border-radius:999px;padding:13px 22px;margin:7px;cursor:pointer;font-weight:700
}
.primary{background:var(--accent);color:white}
.secondary{background:var(--soft);color:var(--ink)}
.status{
  display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;
  background:#eadfc9;border-radius:18px;padding:12px 16px;margin-bottom:18px
}
.log{
  background:#fffaf0;border-left:5px solid var(--accent);padding:14px 16px;
  border-radius:12px;margin:14px 0;min-height:58px
}
.character{display:flex;justify-content:center;margin:10px 0}
.character img{width:min(310px,75vw);aspect-ratio:1/1;object-fit:cover;border-radius:30px}
.badge{display:inline-block;padding:5px 10px;border-radius:999px;background:#dfcfb1;margin:3px}
.rank{font-size:2rem;font-weight:800;margin:12px}
.small{font-size:.9rem;color:#765d49}
.locked{
  height:160px;display:grid;place-items:center;font-size:3rem;background:#ded4c3;
  border-radius:18px
}
.book-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px}
.book-entry{background:#fffaf0;border:1px solid var(--line);border-radius:18px;padding:12px}
.book-entry img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:14px}
.progress{height:9px;background:#dfd2ba;border-radius:9px;overflow:hidden;margin-top:7px}
.progress>div{height:100%;background:#a98b6a}
hr{border:0;border-top:1px dashed #bfae91;margin:22px 0}
@media(max-width:560px){#app{padding:8px}.book{padding:18px;border-radius:18px}}

</style>
</head>

  <main id="app"></main>

function saveDex(id){
  const dex = JSON.parse(localStorage.getItem("tabuminDex") || "[]");

}

function goHuman(){ state=freshState(); state.screen="human"; render(); }
function openDex(){ state.screen="dex"; render(); }

function renderHuman(){
  shell(`<h2>だれの耳たぶで育てる？</h2>
  <p class="small">宿主によって、何かが少し違う……かもしれない。</p>
  <div class="grid">${Object.entries(humans).map(([id,h])=>`
    <button class="card" onclick="chooseHuman('${id}')">
      <div style="font-size:3rem">${h.icon}</div><strong>${h.name}</strong><p>${h.intro}</p>
    </button>`).join("")}</div>`);
}
function chooseHuman(id){ state.human=id; state.screen="ear"; render(); }

function renderEar(){
  const h=humans[state.human];
  shell(`<div class="center"><h2>${h.icon} ${h.name}</h2><p>${h.intro}</p>
    <h3>どちらの耳たぶで育てますか？</h3>
    <div class="grid">
      <button class="card" onclick="chooseEar('left')"><div style="font-size:4rem">👂</div><strong>左耳たぶ</strong></button>
      <button class="card" onclick="chooseEar('right')"><div style="font-size:4rem">👂</div><strong>右耳たぶ</strong></button>
    </div><p class="small">耳たぶによって何か違う……かもしれない。</p></div>`);
}
function chooseEar(ear){ state.ear=ear; state.screen="pre"; state.lastLog="耳たぶの中で、何かがモゾッとした。"; render(); }

const preActions = [
  ["ぷにぷにする",3,"耳たぶがぷにっと戻った。中で何かが喜んだ……気がする。"],
  ["つねる",2,"耳たぶをつねった。中の何かが場所を移動した。"],
  ["ほったらかす",2,"何もしなかった。……勝手に少し育っている。"],
  ["のばす",3,"びよーん。耳たぶの奥から、かすかな気配がする。"],
  ["恋人さわりをする",3,"妙に丁寧にさわった。中の何かが照れた……？"],
  ["氷をつける",3,"キュッ！ 耳たぶが冷えて、中の何かが暴れた。"]
];
function renderPre(){
  const pct=Math.min(100,Math.round(state.preGrowth/state.birthThreshold*100));
  shell(`<div class="status"><span>${humans[state.human].icon} ${humans[state.human].name}</span><span>${state.ear==="left"?"左":"右"}耳たぶ</span></div>
  <div class="center"><div style="font-size:7rem">👂</div><h2>なにかいる……？</h2>
  <div class="progress"><div style="width:${pct}%"></div></div></div>
  <div class="log">${state.lastLog}</div>
  <div class="grid">${preActions.map((a,i)=>`<button class="card" onclick="preAct(${i})">${a[0]}</button>`).join("")}</div>`);
}
function preAct(i){
  const a=preActions[i]; state.preGrowth+=a[1]; state.lastLog=a[2];
  if(state.preGrowth>=state.birthThreshold){
    state.screen="raising"; state.lastLog="スポン！　ただたぶみんが生まれた！";
  }
  render();
}

function pickActions(){ return shuffled(actions).slice(0,4); }
function reaction(){
  const s=state.stats;
  const top=Object.entries(s).filter(([k])=>k!=="stimulation").sort((a,b)=>b[1]-a[1])[0];
  if(s.stimulation>=10) return "最近、刺激に妙に強くなってきた。少しくらいでは動じない。";
  const lines={
    desire:"食べ物や小銭を見ると、じーっと目で追うようになった。",
    affection:"人の話を聞くとき、前よりずっと近くに寄ってくる。",
    sociability:"外の気配がすると、そわそわしている。",
    adventure:"何か起きそうな方へ、自分から近づくようになった。",
    curiosity:"スキマや見慣れないものを、やたら覗いている。",
    relaxation:"気づくと寝転がっている。かなりマイペースだ。"
  };
  return top && top[1]>=5 ? lines[top[0]] : "まだ何者になるのか、よく分からない。";
}

}
function doAction(id){
  const a=actions.find(x=>x.id===id);
  Object.entries(a.delta).forEach(([k,v])=>state.stats[k]+=v);
  state.counts[id]=(state.counts[id]||0)+1;
  state.turn++;
  let special="";
  if(state.counts[id]===3){
    const specials={
      love:"恋バナを聞きすぎて、今度はただたぶみんがこちらの恋愛事情を聞こうとしている。",
      cheese:"チーズが厚すぎて、一瞬ただのチーズに見えた。",
      flick:"デコピンを覚えた。反撃された。",
      pun:"同じダジャレを自分でも言い始めた。"
    };
    special=specials[id]||"同じことを3回した。何かを覚えたようだ。";
  }
  state.lastLog=`${a.name.replace(/^.. /,"")}。 ${special}`;
  if(!state.hostEventDone && state.turn>=4 && Math.random()<0.32){
    state.hostEventDone=true;
    state.lastLog += " " + humans[state.human].event;
    applyHostBonus();
  }
  const evolveChance = state.turn===8 ? .25 : state.turn===9 ? .58 : state.turn>=10 ? 1 : 0;
  if(Math.random()<evolveChance){
    state.evolved=chooseEvolution();
    saveDex(state.evolved);
    state.screen="evolution";
  }
  render();
}
function applyHostBonus(){
  if(state.human==="old"){state.stats.relaxation+=2;state.stats.sociability+=1}
  if(state.human==="child"){state.stats.desire+=1;state.stats.curiosity+=2;state.stats.adventure+=1}
  if(state.human==="youth"){state.stats.curiosity+=2;state.stats.sociability+=1}
  // hidden ear bias
  if(state.ear==="left"){state.stats.affection+=1;state.stats.relaxation+=1}
  else {state.stats.curiosity+=1;state.stats.adventure+=1}
}
function chooseEvolution(){
  const s=state.stats,c=state.counts;
  // Rare: accidental, mixed build + low chance
  const vals=[s.desire,s.affection,s.sociability,s.adventure,s.curiosity,s.relaxation];
  const spread=Math.max(...vals)-Math.min(...vals);
  if(state.turn>=9 && spread<=6 && Math.random()<0.12) return "tanabota";
  const scores={
    charin:s.desire*2 - s.sociability*.3 + (c.coin||0)*2,
    kyun:s.affection*2 + s.sociability + (c.love||0)*2,
    goen:s.sociability*2 + s.curiosity + (c.walk||0)*2,
    maegami:s.adventure*2 + s.stimulation*.8 + (c.pun||0)*1.5 + (c.flick||0),
    futa:s.relaxation + s.stimulation + (c.cheese||0)*2 + ((c.pepper||0)+(c.chili||0))*1.5,
    mikke:s.curiosity*2 + s.adventure + Object.keys(c).length*.55,
    ne:s.relaxation*2 - s.stimulation*.45 + (c.bean||0)+(c.cheese||0)
  };
  return Object.entries(scores).sort((a,b)=>b[1]-a[1])[0][0];
}
function renderEvolution(){
  const t=evolved[state.evolved];
  shell(`<div class="center"><p>ただたぶみんの様子がおかしい……</p>
    <h1>✨ 進化！ ✨</h1><div class="character"><img src="${t.img}"></div>
    <h2>${t.name}</h2><p>${t.desc}</p>
    <button class="primary" onclick="state.screen='companion';render()">オトモ先を決める</button></div>`);
}
function renderCompanion(){
  const t=evolved[state.evolved];
  shell(`<div class="center"><h2>${t.name}を、だれの耳たぶにオトモさせる？</h2></div>
  <div class="grid">${Object.entries(humans).map(([id,h])=>`
    <button class="card" onclick="finish('${id}')"><div style="font-size:3rem">${h.icon}</div><strong>${h.name}</strong><p>${h.intro}</p></button>`).join("")}</div>`);
}
function compatScore(tid,hid){
  const h=humans[hid].traits;
  const profiles={
    charin:{desire:10,relaxation:4},kyun:{affection:10,sociability:7},
    goen:{sociability:10,curiosity:7},maegami:{adventure:10,curiosity:5},
    futa:{relaxation:7,desire:5},mikke:{curiosity:10,adventure:7},ne:{relaxation:10},
    tanabota:{desire:6,affection:6,sociability:6,adventure:6,curiosity:6,relaxation:6}
  };
  const p=profiles[tid]; let score=45;
  Object.entries(p).forEach(([k,v])=>score += (h[k]||0)*v/10*5);
  if(hid===state.human) score+=4; // birthplace familiarity
  return Math.min(100,Math.round(score));
}
function finish(hid){
  const score=compatScore(state.evolved,hid);
  let rank,story;
  if(score>=88){rank="運命耳";story="会った瞬間、たぶみんは迷わず耳たぶへ飛びついた。どうやら、ここに来ることを知っていたらしい。";}
  else if(score>=76){rank="めちゃよし";story="たぶみんは嬉しそうに耳たぶへくっついた。すぐに何か一緒に始めそうだ。";}
  else if(score>=64){rank="まあよし";story="少し様子を見たあと、たぶみんは耳たぶに落ち着いた。悪くないらしい。";}
  else if(score>=52){rank="ビミョー";story="たぶみんは一度くっついたあと、こちらを何とも言えない顔で見た。";}
  else {rank="脱走寸前";story="たぶみんは耳たぶに乗った……と思ったら、もう降りようとしている。";}
  state.ending={hid,rank,story,score}; state.screen="ending"; render();
}
function renderEnding(){
  const h=humans[state.ending.hid],t=evolved[state.evolved];
  shell(`<div class="center"><h1>👂✨ ${state.ending.rank}！</h1>
    <div class="character"><img src="${t.img}"></div>
    <h2>${t.name} × ${h.name}</h2><p>${state.ending.story}</p>
    <p><strong>${t.name}</strong>は、${h.name}の耳たぶにオトモしました。</p>
    <hr><p>📖 ${t.name}が「たぶみん図鑑」に登録された！</p>
    <button class="primary" onclick="goHuman()">もう一度育てる</button>
    <button class="secondary" onclick="openDex()">図鑑を見る</button></div>`);
}
function renderDex(){
  const dex=getDex();
  shell(`<div class="center"><h1>たぶみん生態図鑑</h1><p>${dex.length} / ${Object.keys(evolved).length} 発見</p></div>
  <div class="book-grid">${Object.entries(evolved).map(([id,t])=>dex.includes(id)?`
    <article class="book-entry"><img src="${t.img}"><h3>${t.name}</h3><p>${t.desc}</p></article>`:
    `<article class="book-entry"><div class="locked">？</div><h3>？？？？？</h3><p>まだ出会っていない。</p></article>`).join("")}</div>
  <div class="center"><button class="secondary" onclick="state.screen='title';render()">タイトルへ</button></div>`);
}
render();

</script>
